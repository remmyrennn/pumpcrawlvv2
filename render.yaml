services:
  - type: web
    name: memecrawler
    runtime: python
    rootDir: memecrawler
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LOG_LEVEL
        value: "INFO"
      # ── Required secrets — set these in the Render dashboard ──────────────
      - key: BOT_TOKEN
        sync: false
      - key: AUTHORIZED_USERS
        sync: false
      - key: TARGET_CHAT
        sync: false
      # ── Optional: Helius RPC ───────────────────────────────────────────────
      - key: HELIUS_API_KEY
        sync: false
      # ── Optional: Supabase sync (Sprint 4) ────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ENABLE_SUPABASE_SYNC
        value: "false"
      # ── Maintenance defaults ───────────────────────────────────────────────
      - key: ENABLE_MAINTENANCE
        value: "true"
      - key: DB_RETENTION_DAYS
        value: "7"
      - key: ENABLE_DB_BACKUP
        value: "false"
